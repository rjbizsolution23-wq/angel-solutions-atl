## 🛡️ SECTION 4: SYSTEM COMPLIANCE & BILLING AUDIT PREPARATION
To maintain zero platform disruption, the business operations team should monitor three simple usage thresholds:

1. **AI Conversation Rate Limiting**:  
   The edge gateway limits users to **10 messages per hour** to prevent malicious API spamming and secure the client's billing from billing overruns. 
2. **GHL CRM Active Status**:  
   Ensure the active GHL location billing remains in good standing, as this houses the main sales pipeline calendars.
3. **Stripe Gateway Fees**:  
   Stripe deducts a flat **2.9% + $0.30** per transaction on digital product sales (such as the Skool Monthly signup or Consultation payments). This is collected automatically at checkout.

