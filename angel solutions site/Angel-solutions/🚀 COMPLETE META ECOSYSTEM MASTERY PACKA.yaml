  const response = await aiResponse.json();
  
  // Send AI response
  await sendMessage(senderId, { text: response.text, type: 'text' }, platform);
  
  // Log
  await logResponse(senderId, message, response.text, 'ai_generated');
}

async function sendMessage(recipientId, content, platform) {
  const endpoint = platform === 'messenger' 
    ? 'https://graph.facebook.com/v18.0/me/messages'
    : 'https://graph.facebook.com/v18.0/me/messages';
  
  const payload = {
    recipient: { id: recipientId },
    message: { text: content.text }
  };
  
  const response = await fetch(`${endpoint}?access_token=${PAGE_ACCESS_TOKEN}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  
  if (!response.ok) {
    console.error('❌ Failed to send message:', await response.text());
  }
}

async function logInteraction(senderId, message, platform) {
  await ANGEL_DB.prepare(`
    INSERT INTO interactions (sender_id, message_text, timestamp)
    VALUES (?, ?, ?)
  `).bind(senderId, message, new Date().toISOString()).run();
}

async function logResponse(senderId, message, response, action) {
  await ANGEL_DB.prepare(`
    UPDATE interactions 
    SET response_text = ?, action_taken = ?
    WHERE sender_id = ? AND message_text = ?
    ORDER BY timestamp DESC
    LIMIT 1
  `).bind(response, action, senderId, message).run();
}

async function flagForCompliance(senderId, message) {
  await ANGEL_DB.prepare(`
    UPDATE interactions
    SET compliance_flag = TRUE
    WHERE sender_id = ? AND message_text = ?
  `).bind(senderId, message).run();
}

async function getConversationContext(senderId) {
  const user = await ANGEL_DB.prepare(
    'SELECT * FROM users WHERE sender_id = ?'
  ).bind(senderId).first();
  
  const convo = await ANGEL_DB.prepare(
    'SELECT * FROM conversations WHERE sender_id = ?'
  ).bind(senderId).first();
  
  const interactions = await ANGEL_DB.prepare(
    'SELECT * FROM interactions WHERE sender_id = ? ORDER BY timestamp DESC LIMIT 10'
  ).bind(senderId).all();
  
  return {
    user,
    conversation: convo,
    recent_messages: interactions.results
  };
}

// === COMMENT MODERATION ===

async function processComment(commentData) {
  const commentText = commentData.message?.toLowerCase() || '';
  const commentId = commentData.comment_id;
  
  // Check for moderation triggers
  const shouldHide = await checkCommentModeration(commentText);
  
  if (shouldHide.hide) {
    await hideComment(commentId);
    await logCommentModeration(commentId, commentData, 'hidden', shouldHide.reason);
    return;
  }
  
  // Send friendly reply
  const reply = await generateCommentReply(commentData);
  if (reply) {
    await replyToComment(commentId, reply);
    await logCommentModeration(commentId, commentData, 'replied', 'positive_engagement');
  }
}

async function checkCommentModeration(text) {
  const hidePatterns = [
    { pattern: /spam|scam|fake/i, reason: 'spam' },
    { pattern: /fuck|shit|damn|bitch/i, reason: 'profanity' },
    { pattern: /competitor\.com|otherservice\.com/i, reason: 'competitor_link' },
    { pattern: /refund|scammed me|took my money/i, reason: 'refund_complaint' },
    { pattern: /hate|racist|offensive/i, reason: 'hate_speech' }
  ];
  
  for (const rule of hidePatterns) {
    if (rule.pattern.test(text)) {
      return { hide: true, reason: rule.reason };
    }
  }
  
  return { hide: false };
}

async function hideComment(commentId) {
  await fetch(`https://graph.facebook.com/v18.0/${commentId}?access_token=${PAGE_ACCESS_TOKEN}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ is_hidden: true })
  });
}

async function replyToComment(commentId, replyText) {
  await fetch(`https://graph.facebook.com/v18.0/${commentId}/comments?access_token=${PAGE_ACCESS_TOKEN}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: replyText })
  });
}

async function generateCommentReply(commentData) {
  const firstName = commentData.from?.name?.split(' ')[0] || 'there';
  const commentText = commentData.message?.toLowerCase() || '';
  
  // Positive comments
  if (commentText.includes('thank') || commentText.includes('love') || commentText.includes('great')) {
    return `Thanks so much, ${firstName}! 😊 We appreciate you! Feel free to DM us if you have any questions.`;
  }
  
  // Questions
  if (commentText.includes('?')) {
    return `Great question, ${firstName}! I'll send you a DM with all the details. Check your messages! 💬`;
  }
  
  // General engagement
  if (commentText.length > 10) {
    return `Hey ${firstName}! Thanks for engaging with us! 😊 DM us if you'd like to learn more!`;
  }
  
  return null; // Don't reply to short/unclear comments
}

async function logCommentModeration(commentId, data, action, reason) {
  await ANGEL_DB.prepare(`
    INSERT INTO comment_moderation (comment_id, post_id, commenter_id, comment_text, action, reason, timestamp)
    VALUES (?, ?, ?, ?, ?, ?, ?)
  `).bind(
    commentId,
    data.post_id,
    data.from?.id,
    data.message,
    action,
    reason,
    new Date().toISOString()
  ).run();
}
