Copy# keyword_engine.py
import re
from typing import Dict, List, Optional
from anthropic import Anthropic
from openai import OpenAI

class KeywordTriggerEngine:
    def __init__(self, db_connection, ai_client):
        self.db = db_connection
        self.ai = ai_client
        self.intent_cache = {}
    
    async def analyze_message(self, message: str, sender_id: str) -> Dict:
        """Multi-layered keyword and intent detection"""
        
        # Layer 1: Direct keyword match (fast)
        direct_match = await self.check_direct_keywords(message)
        if direct_match:
            return {
                'match_type': 'direct',
                'intent': direct_match['intent'],
                'action': direct_match['action'],
                'confidence': 1.0
            }
        
        # Layer 2: NLP-based intent classification
        intent = await self.classify_intent(message)
        
        # Layer 3: Context-aware matching (with history)
        context = await self.get_conversation_context(sender_id)
        enriched_intent = await self.contextual_analysis(message, context)
        
        return {
            'match_type': 'nlp',
            'intent': enriched_intent['intent'],
            'action': enriched_intent['action'],
            'confidence': enriched_intent['confidence'],
            'entities': enriched_intent['entities']
        }
    
    async def check_direct_keywords(self, message: str) -> Optional[Dict]:
        """Fast direct keyword matching using database"""
        message_lower = message.lower()
        
        # Query D1 database
        result = await self.db.execute(
            "SELECT * FROM keywords WHERE ? LIKE '%'||keyword||'%' ORDER BY priority DESC LIMIT 1",
            (message_lower,)
        )
        
        return result[0] if result else None
    
    async def classify_intent(self, message: str) -> str:
        """AI-powered intent classification"""
        
        prompt = f"""Classify the intent of this message into ONE of these categories:
        - purchase_intent (ready to buy/sign up)
        - information_seeking (asking questions)
        - support_request (needs help)
        - legal_dispute (dispute, complaint, legal issue)
        - objection_handling (price concern, skepticism)
        - scheduling (wants appointment/call)
        
        Message: "{message}"
        
        Respond with ONLY the category name."""
        
        response = await self.ai.messages.create(
            model="claude-3-5-sonnet-20241022",
            max_tokens=50,
            messages=[{"role": "user", "content": prompt}]
        )
        
        return response.content[0].text.strip()
    
    async def contextual_analysis(self, message: str, context: Dict) -> Dict:
        """Deep contextual analysis with conversation history"""
        
        prompt = f"""Analyze this message with context:

Current message: "{message}"

Conversation history:
{context.get('history', 'No previous messages')}

User profile:
- Previous interactions: {context.get('interaction_count', 0)}
- Lead score: {context.get('lead_score', 0)}
- Service interest: {context.get('service_interest', 'unknown')}

Extract:
1. Primary intent
2. Suggested action (checkout, legal_playbook, ai_response, calendar_booking)
3. Confidence score (0-1)
4. Key entities (names, dates, amounts, services)

Respond in JSON format."""
        
        response = await self.ai.messages.create(
            model="claude-3-5-sonnet-20241022",
            max_tokens=500,
            messages=[{"role": "user", "content": prompt}]
        )
        
        return json.loads(response.content[0].text)
    
    async def get_conversation_context(self, sender_id: str) -> Dict:
        """Retrieve conversation context from D1"""
        
        result = await self.db.execute("""
            SELECT 
                u.lead_score,
                u.service_interest,
                c.conversation_state,
                c.current_flow,
                COUNT(i.id) as interaction_count,
                GROUP_CONCAT(i.message, '|') as recent_messages
            FROM users u
            LEFT JOIN conversations c ON u.sender_id = c.sender_id
            LEFT JOIN interactions i ON u.sender_id = i.sender_id
            WHERE u.sender_id = ?
            GROUP BY u.sender_id
        """, (sender_id,))
        
        return result[0] if result else {}
