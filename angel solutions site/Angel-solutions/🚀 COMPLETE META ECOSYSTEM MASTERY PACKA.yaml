const twilio = require('twilio');

class SMSEscalationSystem {
  constructor(accountSid, authToken, twilioPhoneNumber, rickPhoneNumber) {
    this.client = twilio(accountSid, authToken);
    this.twilioPhone = twilioPhoneNumber;
    this.rickPhone = rickPhoneNumber; // +14703386689
    
    this.escalationReasons = {
      'vip_lead': {
        priority: 'high',
        emoji: '⭐',
        template: 'VIP Lead Alert'
      },
      'refund_request': {
        priority: 'critical',
        emoji: '🚨',
        template: 'Refund Request'
      },
      'custom_pricing': {
        priority: 'high',
        emoji: '💰',
        template: 'Custom Pricing Inquiry'
      },
      'billing_issue': {
        priority: 'high',
        emoji: '💳',
        template: 'Billing Issue'
      },
      'angry_customer': {
        priority: 'critical',
        emoji: '😡',
        template: 'Upset Customer'
      },
      'legal_threat': {
        priority: 'critical',
        emoji: '⚖️',
        template: 'Legal Threat'
      }
    };
  }
  
  async escalateToRick(leadData, reason, urgency = 'normal') {
    /**
     * Send SMS alert to Rick
     * Target response time: < 5 minutes
     */
    
    const escalation = this.escalationReasons[reason];
    
    if (!escalation) {
      console.error('Unknown escalation reason:', reason);
      return;
    }
    
    console.log(`${escalation.emoji} Escalating to Rick: ${reason}`);
    
    // Construct SMS message
    const smsBody = this.buildEscalationMessage(leadData, escalation, urgency);
    
    try {
      // Send SMS
      const message = await this.client.messages.create({
        body: smsBody,
        from: this.twilioPhone,
        to: this.rickPhone
      });
      
      console.log('✅ Escalation SMS sent:', message.sid);
      
      // Log to database
      await this.logEscalation(leadData.sender_id, reason, urgency, message.sid);
      
      // Set up response monitoring
      await this.setupResponseMonitor(leadData.sender_id, reason);
      
      return {
        success: true,
        message_sid: message.sid,
        sent_at: new Date().toISOString()
      };
      
    } catch (error) {
      console.error('❌ Failed to send escalation SMS:', error);
      throw error;
    }
  }
  
  buildEscalationMessage(leadData, escalation, urgency) {
    /**
     * Build formatted SMS message
     */
    
    const urgencyEmoji = urgency === 'critical' ? '🚨🚨' : urgency === 'high' ? '⚠️' : '📢';
    
    let message = `${urgencyEmoji} ${escalation.emoji} ${escalation.template}\n\n`;
    
    // Lead info
    message += `👤 ${leadData.first_name || 'Unknown'} ${leadData.last_name || ''}\n`;
    message += `📱 Platform: ${leadData.platform === 'messenger' ? 'Messenger' : 'Instagram'}\n`;
    
    if (leadData.phone_number) {
      message += `📞 Phone: ${leadData.phone_number}\n`;
    }
    
    if (leadData.email) {
      message += `📧 Email: ${leadData.email}\n`;
    }
    
    message += `\n`;
    
    // Reason-specific details
    if (escalation.template === 'VIP Lead Alert') {
      message += `💎 VIP LEAD DETECTED\n`;
      message += `Goal: ${leadData.goal || 'Not specified'}\n`;
      message += `Timeline: ${leadData.timeline || 'Not specified'}\n`;
      message += `Lead Score: ${leadData.lead_score || 0}/100\n`;
      message += `\nLikely high-value client. Quick response recommended!\n`;
      
    } else if (escalation.template === 'Refund Request') {
      message += `🚨 REFUND REQUEST\n`;
      message += `Customer is requesting a refund.\n`;
      message += `Last message: "${leadData.last_message?.substring(0, 100)}..."\n`;
      message += `\nRequires immediate attention per policy.\n`;
      
    } else if (escalation.template === 'Custom Pricing Inquiry') {
      message += `💰 CUSTOM PRICING REQUEST\n`;
      message += `Situation: ${leadData.situation || 'Complex case'}\n`;
      message += `They're asking for custom pricing outside standard $67/$795 plans.\n`;
      
    } else if (escalation.template === 'Billing Issue') {
      message += `💳 BILLING ISSUE\n`;
      message += `Payment problem reported.\n`;
      message += `Details: ${leadData.billing_details || 'See conversation'}\n`;
      
    } else if (escalation.template === 'Upset Customer') {
      message += `😡 UPSET CUSTOMER\n`;
      message += `Customer is expressing frustration.\n`;
      message += `Last message: "${leadData.last_message?.substring(0, 100)}..."\n`;
      message += `\nNeeds personal touch to resolve.\n`;
      
    } else if (escalation.template === 'Legal Threat') {
      message += `⚖️ LEGAL THREAT DETECTED\n`;
      message += `Customer mentioned legal action.\n`;
      message += `Last message: "${leadData.last_message?.substring(0, 100)}..."\n`;
      message += `\n⚠️ URGENT: Document everything, consult legal if needed.\n`;
    }
    
    // Add link to conversation
    message += `\n🔗 View conversation: https://business.facebook.com/latest/inbox/all?asset_id=107318795356062&mailbox_id=${leadData.sender_id}`;
    
    // Response time expectation
    if (urgency === 'critical') {
      message += `\n\n⏰ Response needed: ASAP (< 5 min)`;
    } else if (urgency === 'high') {
      message += `\n\n⏰ Response needed: Within 30 min`;
    } else {
      message += `\n\n⏰ Response needed: Within 2 hours`;
    }
    
    return message;
  }
  
  async logEscalation(senderId, reason, urgency, messageSid) {
    /**
     * Log escalation to D1 database
     */
    
    await ANGEL_DB.prepare(`
      INSERT INTO escalations (sender_id, reason, urgency, sms_sent, created_at)
      VALUES (?, ?, ?, TRUE, ?)
    `).bind(senderId, reason, urgency, new Date().toISOString()).run();
  }
  
  async setupResponseMonitor(senderId, reason) {
    /**
     * Monitor for Jordynn's response
     * If no response within SLA, send reminder
     */
    
    const slaMinutes = reason === 'legal_threat' || reason === 'refund_request' ? 5 : 30;
    
    // Schedule reminder check (would use Cloudflare Durable Objects or external cron)
    setTimeout(async () => {
      const responded = await this.checkIfResponded(senderId);
      
      if (!responded) {
        await this.sendReminderSMS(senderId, reason);
      }
    }, slaMinutes * 60 * 1000);
  }
  
  async checkIfResponded(senderId) {
    /**
     * Check if Rick responded to the escalation
     */
    
    const result = await ANGEL_DB.prepare(`
      SELECT rick_responded FROM escalations
      WHERE sender_id = ?
      ORDER BY created_at DESC
      LIMIT 1
    `).bind(senderId).first();
    
    return result?.rick_responded || false;
  }
  
  async sendReminderSMS(senderId, reason) {
    /**
     * Send reminder if no response
     */
    
    const message = `⏰ REMINDER: ${this.escalationReasons[reason].emoji} ${this.escalationReasons[reason].template} still pending response.\n\nLead ID: ${senderId}\n\nPlease check Meta Business Suite inbox.`;
    
    await this.client.messages.create({
      body: message,
      from: this.twilioPhone,
      to: this.rickPhone
    });
  }
  
  async markAsResponded(senderId) {
    /**
     * Mark escalation as responded when Rick handles it
     */
    
    await ANGEL_DB.prepare(`
      UPDATE escalations
      SET rick_responded = TRUE
      WHERE sender_id = ?
      ORDER BY created_at DESC
      LIMIT 1
    `).bind(senderId).run();
  }
  
  async sendDailySummary() {
    /**
     * Send end-of-day summary to Rick
     * Run at 6 PM EST daily
     */
    
    const today = new Date().toISOString().split('T')[0];
    
    // Get today's stats
    const stats = await ANGEL_DB.prepare(`
      SELECT 
        COUNT(*) as total_conversations,
        COUNT(DISTINCT sender_id) as unique_leads,
        SUM(CASE WHEN conversation_state = 'sent_link' THEN 1 ELSE 0 END) as links_sent,
        AVG(lead_score) as avg_lead_score
      FROM conversations
      WHERE DATE(started_at) = ?
    `).bind(today).first();
    
    const escalations = await ANGEL_DB.prepare(`
      SELECT reason, COUNT(*) as count
      FROM escalations
      WHERE DATE(created_at) = ?
      GROUP BY reason
    `).bind(today).all();
    
    let summary = `📊 Angel Solutions ATL - Daily Summary (${today})\n\n`;
    summary += `💬 Total Conversations: ${stats.total_conversations}\n`;
    summary += `👥 Unique Leads: ${stats.unique_leads}\n`;
    summary += `🔗 Links Sent: ${stats.links_sent}\n`;
    summary += `⭐ Avg Lead Score: ${Math.round(stats.avg_lead_score)}/100\n`;
    
    if (escalations.results.length > 0) {
      summary += `\n🚨 Escalations Today:\n`;
      escalations.results.forEach(e => {
        summary += `  ${this.escalationReasons[e.reason]?.emoji || '•'} ${e.reason}: ${e.count}\n`;
      });
    }
    
    summary += `\n✅ All systems operational\n`;
    summary += `📱 View full dashboard: [Your Analytics URL]`;
    
    await this.client.messages.create({
      body: summary,
      from: this.twilioPhone,
      to: this.rickPhone
    });
  }
}

