            'payment_reminder': f"Hi {sender_name}, just a friendly reminder that your checkout link for {service_type} is ready. Click the link I sent, and you'll be all set up in just 2 minutes!",
            
            'thank_you': f"Thank you so much, {sender_name}! I'm thrilled to welcome you as a client. Our team will be reaching out within 24 hours to get started on your {service_type}. Talk soon!"
        }
        
        script = scripts.get(message_type, scripts['follow_up'])
        
        return await self.generate_voice_message(script)
    
    async def send_voice_to_messenger(
        self, 
        sender_id: str, 
        audio_bytes: bytes,
        messenger_api
    ):
        """
        Upload and send voice message to Messenger
        """
        
        # Upload audio to temporary storage
        audio_url = await self.upload_audio(audio_bytes)
        
        # Send via Messenger
        message = {
            'recipient': {'id': sender_id},
            'message': {
                'attachment': {
                    'type': 'audio',
                    'payload': {
                        'url': audio_url,
                        'is_reusable': True
                    }
                }
            }
        }
        
        await messenger_api.send_message(message)
