2. CLOUDFLARE D1 DATABASE SCHEMA
Complete Database Structure:

Copy-- Users Table
CREATE TABLE users (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  sender_id TEXT UNIQUE NOT NULL,
  platform TEXT NOT NULL, -- 'messenger', 'instagram', 'whatsapp'
  first_name TEXT,
  last_name TEXT,
  phone_number TEXT,
  email TEXT,
  lead_score INTEGER DEFAULT 0,
  idempotency_key TEXT UNIQUE,
  created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
  updated_at DATETIME DEFAULT CURRENT_TIMESTAMP
);

-- Keywords Table
CREATE TABLE keywords (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  keyword TEXT NOT NULL,
  intent TEXT NOT NULL, -- 'purchase', 'support', 'dispute', 'info'
  action TEXT NOT NULL, -- 'checkout', 'legal_playbook', 'ai_response'
  priority INTEGER DEFAULT 1,
  created_at DATETIME DEFAULT CURRENT_TIMESTAMP
);

-- Interactions Table
CREATE TABLE interactions (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  sender_id TEXT NOT NULL,
  message TEXT,
  response TEXT,
  intent TEXT,
  sentiment REAL,
  timestamp DATETIME DEFAULT CURRENT_TIMESTAMP,
  FOREIGN KEY (sender_id) REFERENCES users(sender_id)
);

-- Conversations Table
CREATE TABLE conversations (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  sender_id TEXT NOT NULL,
  conversation_state TEXT DEFAULT 'active', -- 'active', 'waiting', 'closed'
  current_flow TEXT, -- 'onboarding', 'purchase', 'support'
  metadata TEXT, -- JSON
  started_at DATETIME DEFAULT CURRENT_TIMESTAMP,
  last_interaction DATETIME DEFAULT CURRENT_TIMESTAMP,
  FOREIGN KEY (sender_id) REFERENCES users(sender_id)
);

-- Lead Details Table
CREATE TABLE leads (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  sender_id TEXT NOT NULL,
  lead_source TEXT, -- 'facebook_ad', 'instagram_dm', 'organic'
  service_interest TEXT, -- 'credit_repair', 'real_estate', etc.
  qualification_score INTEGER,
  crm_synced BOOLEAN DEFAULT FALSE,
  crm_id TEXT,
  created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
  FOREIGN KEY (sender_id) REFERENCES users(sender_id)
);

-- Follow-Ups Table
CREATE TABLE follow_ups (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  sender_id TEXT NOT NULL,
  scheduled_time DATETIME NOT NULL,
  message TEXT NOT NULL,
  status TEXT DEFAULT 'pending', -- 'pending', 'sent', 'failed'
  retry_count INTEGER DEFAULT 0,
  created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
  FOREIGN KEY (sender_id) REFERENCES users(sender_id)
);

-- Stripe Checkout Sessions
CREATE TABLE checkout_sessions (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  sender_id TEXT NOT NULL,
  stripe_session_id TEXT UNIQUE,
  product_id TEXT,
  amount INTEGER,
  status TEXT, -- 'created', 'completed', 'expired'
  created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
  FOREIGN KEY (sender_id) REFERENCES users(sender_id)
);

-- Create indexes for performance
CREATE INDEX idx_users_sender ON users(sender_id);
CREATE INDEX idx_interactions_sender ON interactions(sender_id);
CREATE INDEX idx_keywords_keyword ON keywords(keyword);
CREATE INDEX idx_follow_ups_scheduled ON follow_ups(scheduled_time, status);
