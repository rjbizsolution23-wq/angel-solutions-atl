        }
    
    async def qualify_lead(self, sender_id: str, conversation_data: Dict) -> Dict:
        """
        Main qualification logic
        Returns: {'recommended_plan': '67' or 'advanced', 'confidence': 0-1, 'reasons': []}
        """
        
        data = json.loads(conversation_data.get('data_collected', '{}'))
        
        # Extract key info
        timeline = data.get('timeline', '').lower()
        goal = data.get('goal', '').lower()
        bankruptcy = data.get('bankruptcy', 'unknown')
        child_support = data.get('child_support', 'unknown')
        collections_count = data.get('collections_count', 0)
        is_business_owner = 'business' in goal or 'funding' in goal
        
        qualification_result = {
            'sender_id': sender_id,
            'recommended_plan': None,
            'confidence': 0.0,
            'reasons': [],
            'disqualifiers': [],
            'next_questions': []
        }
        
        # === CHECK DISQUALIFIERS FIRST ===
        
        # Bankruptcy check
        if bankruptcy == 'yes':
            qualification_result['disqualifiers'].append('Active bankruptcy')
            qualification_result['recommended_plan'] = 'advanced'
            qualification_result['reasons'].append('Bankruptcy requires legal team (Advanced plan)')
            qualification_result['confidence'] = 0.9
            
            await self._update_credit_profile(sender_id, {
                'has_bankruptcy': True,
                'qualified_for_67_plan': False,
                'qualified_for_advanced': True,
                'disqualified_reason': 'bankruptcy'
            })
            
            return qualification_result
        
        # Child support arrears
        if child_support == 'yes':
            qualification_result['disqualifiers'].append('Child support arrears')
            qualification_result['recommended_plan'] = 'advanced'
            qualification_result['reasons'].append('Child support issues require legal assistance')
            qualification_result['confidence'] = 0.9
            
            await self._update_credit_profile(sender_id, {
                'has_child_support_arrears': True,
                'qualified_for_67_plan': False,
                'qualified_for_advanced': True,
                'disqualified_reason': 'child_support'
            })
            
            return qualification_result
        
        # === SCORE-BASED QUALIFICATION ===
        
        score_67 = 0
        score_advanced = 0
        
        # Timeline scoring
        if any(keyword in timeline for keyword in ['rush', 'fast', 'asap', '30', '60']):
            score_advanced += 40
            qualification_result['reasons'].append('Urgent timeline → Advanced plan faster')
        elif any(keyword in timeline for keyword in ['patient', 'no rush', 'months', 'slow']):
            score_67 += 30
            qualification_result['reasons'].append('Flexible timeline → $67 plan works great')
        
        # Goal scoring
        if 'home' in goal or 'house' in goal or 'mortgage' in goal:
            score_advanced += 20  # Home buyers usually need fast results
            qualification_result['reasons'].append('Home purchase goal → May need Advanced for speed')
        
        if 'funding' in goal or 'business' in goal or 'capital' in goal:
