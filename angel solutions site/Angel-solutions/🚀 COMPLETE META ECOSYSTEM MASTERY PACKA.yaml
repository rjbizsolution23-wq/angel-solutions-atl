import asyncio
from datetime import datetime, timedelta
import schedule
import time

class AngelSolutionsFollowUpSystem:
    """
    Automated 7-step follow-up system for Angel Solutions ATL
    Runs hourly, max 7 follow-ups per lead
    """
    
    def __init__(self, db, messenger_api, sms_escalation):
        self.db = db
        self.messenger = messenger_api
        self.sms = sms_escalation
        
        # 7-Step Follow-Up Sequence
        self.follow_up_sequence = {
            1: {
                'delay_hours': 2,
                'message_template': 'initial_follow_up',
                'goal': 'Re-engage warm leads'
            },
            2: {
                'delay_hours': 24,
                'message_template': 'value_reminder',
                'goal': 'Remind of benefits'
            },
            3: {
                'delay_hours': 48,
                'message_template': 'success_story',
                'goal': 'Social proof'
            },
            4: {
                'delay_hours': 72,
                'message_template': 'objection_handler',
                'goal': 'Address concerns'
            },
            5: {
                'delay_hours': 120,  # 5 days
                'message_template': 'limited_time_offer',
                'goal': 'Create urgency'
            },
            6: {
                'delay_hours': 168,  # 7 days
                'message_template': 'final_check_in',
                'goal': 'Last attempt'
            },
            7: {
                'delay_hours': 336,  # 14 days
                'message_template': 'breakup_message',
                'goal': 'Graceful exit + door open'
            }
        }
    
    async def run_hourly_check(self):
        """
        Main cron job - runs every hour
        """
        
        current_time = datetime.now()
        print(f"\n{'='*60}")
        print(f"🕐 Running follow-up check: {current_time.strftime('%Y-%m-%d %H:%M:%S')} EST")
        print(f"{'='*60}\n")
        
        # Get all pending follow-ups scheduled for now or earlier
        pending_follow_ups = await self.get_pending_follow_ups(current_time)
        
        print(f"📋 Found {len(pending_follow_ups)} pending follow-ups")
        
        for follow_up in pending_follow_ups:
            await self.process_follow_up(follow_up)
        
        # Check for stale conversations (no activity in 2 hours)
        await self.check_stale_conversations()
        
        # Check for "no longer interested" conversations (stop following up)
        await self.cleanup_lost_leads()
        
        print(f"\n✅ Follow-up check completed\n")
    
    async def get_pending_follow_ups(self, current_time):
        """Get follow-ups due now"""
        
        result = await self.db.execute("""
            SELECT * FROM follow_ups
            WHERE status = 'pending'
            AND scheduled_time <= ?
            ORDER BY scheduled_time ASC
        """, (current_time.isoformat(),))
        
        return result
    
    async def process_follow_up(self, follow_up):
        """Process individual follow-up"""
        
        sender_id = follow_up['sender_id']
        follow_up_number = follow_up['follow_up_number']
        
        print(f"📤 Processing follow-up #{follow_up_number} for {sender_id}")
        
        try:
            # Check if user responded since scheduling
            recent_activity = await self.check_recent_activity(sender_id)
            
            if recent_activity:
                # User already engaged - cancel follow-up
                await self.cancel_follow_up(follow_up['id'], 'user_responded')
                print(f"  ✓ Cancelled - user already responded")
                return
            
            # Check if user said "not interested"
            is_lost = await self.check_if_lost(sender_id)
            
            if is_lost:
                await self.cancel_follow_up(follow_up['id'], 'user_not_interested')
                print(f"  ✓ Cancelled - user not interested")
                return
            
            # Get user context
            context = await self.get_user_context(sender_id)
            
            # Generate message
            message = await self.generate_follow_up_message(
                follow_up_number,
                context
            )
            
            # Send message
            await self.messenger.send_text_message(sender_id, message, context['platform'])
            
            # Mark as sent
            await self.mark_follow_up_sent(follow_up['id'])
            
            # Schedule next follow-up (if not at max 7)
            if follow_up_number < 7:
                await self.schedule_next_follow_up(sender_id, follow_up_number + 1, context)
            
            print(f"  ✅ Sent follow-up #{follow_up_number}")
            
        except Exception as e:
            # Mark as failed
            await self.mark_follow_up_failed(follow_up['id'], str(e))
            print(f"  ❌ Failed: {str(e)}")
    
