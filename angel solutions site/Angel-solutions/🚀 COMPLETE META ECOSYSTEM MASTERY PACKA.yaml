        # Check for escalation keywords
        escalation_keywords = ['custom pricing', 'refund', 'billing', 'speak to owner']
        if any(keyword in text.lower() for keyword in escalation_keywords):
            actions['escalate'] = True
            actions['escalation_reason'] = 'detected_in_response'
        
        return actions

