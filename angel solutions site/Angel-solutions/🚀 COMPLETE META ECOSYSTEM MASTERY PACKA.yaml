            qualification_result['reasons'].append('Car loan goal → $67 plan sufficient')
        
        if 'cards' in goal or 'credit card' in goal:
            score_67 += 25
            qualification_result['reasons'].append('Credit card approval → $67 plan works')
        
        # Collections count
        if collections_count > 10:
            score_advanced += 30
            qualification_result['reasons'].append(f'{collections_count} collections → Advanced disputes all at once')
        elif collections_count > 0 and collections_count <= 5:
            score_67 += 25
            qualification_result['reasons'].append(f'{collections_count} collections → $67 plan handles this')
        
        # Business owner flag
        if is_business_owner:
            score_advanced += 35
            qualification_result['reasons'].append('Business owner → Advanced includes funding pathway')
        
        # === DETERMINE RECOMMENDATION ===
        
        if score_advanced > score_67:
            qualification_result['recommended_plan'] = 'advanced'
            qualification_result['confidence'] = min(score_advanced / 100, 0.95)
            
