            'compliance_verified': True
        }
    
    def _build_history(self, context: dict) -> str:
        """Build conversation history for Claude"""
        
        history = "Conversation history:\n\n"
        
        recent_messages = context.get('recent_messages', [])
        for msg in recent_messages[-5:]:  # Last 5 messages
            history += f"User: {msg['message_text']}\n"
            if msg.get('response_text'):
                history += f"You: {msg['response_text']}\n"
            history += "\n"
        
        return history
    
    def _check_compliance(self, text: str) -> list:
        """Check for compliance violations"""
        
        issues = []
        
        # Check for guarantees
        if any(word in text.lower() for word in ['guarantee', 'guaranteed', 'promise', 'will remove', 'will fix']):
            issues.append('contains_guarantee')
        
        # Check for "credit sweep"
        if 'credit sweep' in text.lower() or 'sweep' in text.lower():
            issues.append('mentions_sweep')
        
        # Check for overnight/fast promises
        if any(word in text.lower() for word in ['overnight', 'instant', 'immediately fix', 'quick fix']):
            issues.append('unrealistic_timeline')
        
        # Check for unauthorized links
        approved_domains = ['skool.com', 'angelsolutionsatl.com', 'share.google']
        if 'http' in text and not any(domain in text.lower() for domain in approved_domains):
            issues.append('unauthorized_link')
        
        return issues
    
    async def _regenerate_compliant(self, message: str, context: dict, issues: list) -> str:
        """Regenerate response with compliance fixes"""
        
        fix_prompt = f"""The previous response contained compliance violations: {', '.join(issues)}

CRITICAL COMPLIANCE RULES:
- NEVER guarantee or promise results
- NEVER mention "credit sweep"
- NEVER promise overnight/instant fixes
- Only use approved links

Regenerate your response to "{message}" while being compliant, warm, and effective."""

        response = await self.claude.messages.create(
            model="claude-3-5-sonnet-20241022",
            max_tokens=600,
            system=self.system_prompt,
            messages=[{"role": "user", "content": fix_prompt}]
        )
        
        return response.content[0].text
    
    def _extract_actions(self, text: str, context: dict) -> dict:
        """Extract actions from response"""
        
        actions = {}
        
        # Check if booking link was sent
        if 'angelsolutionsatl.com/book' in text.lower():
            actions['sent_booking_link'] = True
            actions['update_stage'] = 'sent_link'
        
        # Check if Skool link was sent
