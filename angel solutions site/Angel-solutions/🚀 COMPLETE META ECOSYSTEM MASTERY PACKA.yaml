    async def check_recent_activity(self, sender_id):
        """Check if user responded since last follow-up was scheduled"""
        
        # Check last 24 hours of activity
        cutoff = (datetime.now() - timedelta(hours=24)).isoformat()
        
        result = await self.db.execute("""
            SELECT COUNT(*) as count FROM interactions
            WHERE sender_id = ? AND timestamp > ?
        """, (sender_id, cutoff))
        
        return result[0]['count'] > 0
    
    async def check_if_lost(self, sender_id):
        """Check if user said they're not interested"""
        
        result = await self.db.execute("""
            SELECT conversation_state FROM conversations
            WHERE sender_id = ?
        """, (sender_id,))
        
        if result and result[0]['conversation_state'] == 'lost':
            return True
        
        # Check for "not interested" keywords in recent messages
        recent = await self.db.execute("""
            SELECT message_text FROM interactions
            WHERE sender_id = ?
            ORDER BY timestamp DESC
            LIMIT 3
        """, (sender_id,))
        
        not_interested_keywords = [
            'not interested',
            'no thanks',
            'stop messaging',
            'leave me alone',
            'unsubscribe',
            'no longer interested'
        ]
        
        for msg in recent:
            text = msg['message_text'].lower()
            if any(keyword in text for keyword in not_interested_keywords):
                # Mark as lost
                await self.db.execute("""
                    UPDATE conversations
                    SET conversation_state = 'lost'
                    WHERE sender_id = ?
                """, (sender_id,))
                return True
        
        return False
    
    async def get_user_context(self, sender_id):
        """Get full user context"""
        
        user = await self.db.execute(
            'SELECT * FROM users WHERE sender_id = ?',
            (sender_id,)
        )
        
        credit_profile = await self.db.execute(
            'SELECT * FROM credit_profiles WHERE sender_id = ?',
            (sender_id,)
        )
        
        conversation = await self.db.execute(
            'SELECT * FROM conversations WHERE sender_id = ?',
            (sender_id,)
        )
        
        return {
            'user': user[0] if user else {},
            'credit_profile': credit_profile[0] if credit_profile else {},
            'conversation_data': conversation[0] if conversation else {},
            'platform': user[0]['platform'] if user else 'messenger'
        }
    
    async def schedule_next_follow_up(self, sender_id, next_number, context):
        """Schedule the next follow-up in sequence"""
        
        if next_number > 7:
            return  # Max 7 follow-ups
        
        sequence = self.follow_up_sequence[next_number]
        scheduled_time = datetime.now() + timedelta(hours=sequence['delay_hours'])
        
        await self.db.execute("""
            INSERT INTO follow_ups (sender_id, follow_up_number, scheduled_time, message, status)
            VALUES (?, ?, ?, ?, 'pending')
        """, (sender_id, next_number, scheduled_time.isoformat(), sequence['message_template']))
        
        print(f"  📅 Scheduled follow-up #{next_number} for {scheduled_time.strftime('%Y-%m-%d %H:%M')}")
    
    async def mark_follow_up_sent(self, follow_up_id):
        """Mark follow-up as sent"""
        
        await self.db.execute("""
            UPDATE follow_ups
            SET status = 'sent'
            WHERE id = ?
        """, (follow_up_id,))
    
    async def mark_follow_up_failed(self, follow_up_id, error):
        """Mark follow-up as failed"""
        
        await self.db.execute("""
            UPDATE follow_ups
            SET status = 'failed', retry_count = retry_count + 1
            WHERE id = ?
        """, (follow_up_id,))
    
    async def cancel_follow_up(self, follow_up_id, reason):
        """Cancel follow-up"""
        
        await self.db.execute("""
            UPDATE follow_ups
            SET status = 'cancelled'
            WHERE id = ?
        """, (follow_up_id,))
    
    async def check_stale_conversations(self):
        """Find conversations with no activity in 2 hours"""
        
        cutoff = (datetime.now() - timedelta(hours=2)).isoformat()
        
        stale = await self.db.execute("""
            SELECT c.sender_id, u.first_name, c.conversation_state, c.current_offer
            FROM conversations c
            JOIN users u ON c.sender_id = u.sender_id
            WHERE c.conversation_state = 'active'
            AND c.last_interaction < ?
            AND NOT EXISTS (
                SELECT 1 FROM follow_ups
                WHERE sender_id = c.sender_id AND status = 'pending'
            )
        """, (cutoff,))
        
        for conv in stale:
            # Start follow-up sequence
            await self.schedule_next_follow_up(conv['sender_id'], 1, {'user': {'first_name': conv['first_name']}})
            
            print(f"🔄 Started follow-up sequence for stale conversation: {conv['sender_id']}")
    
    async def cleanup_lost_leads(self):
        """Cancel all pending follow-ups for lost leads"""
        
        await self.db.execute("""
            UPDATE follow_ups
            SET status = 'cancelled'
            WHERE sender_id IN (
                SELECT sender_id FROM conversations WHERE conversation_state = 'lost'
            )
            AND status = 'pending'
        """)

