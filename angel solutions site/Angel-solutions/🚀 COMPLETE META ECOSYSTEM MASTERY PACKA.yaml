import aiohttp
import json
from typing import Dict, List

class MetaMessengerAPI:
    def __init__(self, page_access_token):
        self.access_token = page_access_token
        self.base_url = 'https://graph.facebook.com/v18.0'
    
    async def send_text_message(self, recipient_id: str, text: str, platform: str = 'messenger'):
        """Send text message to Messenger or Instagram"""
        
        endpoint = '/me/messages' if platform == 'messenger' else '/me/messages'
        
        payload = {
            'recipient': {'id': recipient_id},
            'message': {'text': text}
        }
        
        return await self._send_request(endpoint, payload)
    
    async def send_quick_replies(
        self, 
        recipient_id: str, 
        text: str, 
        quick_replies: List[Dict]
    ):
        """Send message with quick reply buttons"""
        
        payload = {
            'recipient': {'id': recipient_id},
            'message': {
                'text': text,
                'quick_replies': quick_replies
            }
        }
        
        return await self._send_request('/me/messages', payload)
    
    async def send_button_template(
        self, 
        recipient_id: str, 
        text: str, 
        buttons: List[Dict]
    ):
        """Send message with button template"""
        
        payload = {
            'recipient': {'id': recipient_id},
            'message': {
                'attachment': {
                    'type': 'template',
                    'payload': {
                        'template_type': 'button',
                        'text': text,
                        'buttons': buttons
                    }
                }
            }
        }
        
        return await self._send_request('/me/messages', payload)
    
    async def send_generic_template(
        self, 
        recipient_id: str, 
        elements: List[Dict]
    ):
        """Send carousel/card template"""
        
        payload = {
            'recipient': {'id': recipient_id},
            'message': {
                'attachment': {
                    'type': 'template',
                    'payload': {
                        'template_type': 'generic',
                        'elements': elements
                    }
                }
            }
        }
        
        return await self._send_request('/me/messages', payload)
    
    async def send_media(
        self, 
        recipient_id: str, 
        media_type: str, 
        media_url: str
    ):
        """Send image, video, or audio"""
        
        payload = {
            'recipient': {'id': recipient_id},
            'message': {
                'attachment': {
                    'type': media_type,  # 'image', 'video', 'audio', 'file'
                    'payload': {
                        'url': media_url,
                        'is_reusable': True
                    }
                }
            }
        }
        
        return await self._send_request('/me/messages', payload)
    
    async def _send_request(self, endpoint: str, payload: Dict):
        """Internal method to send API requests"""
        
        url = f"{self.base_url}{endpoint}"
        params = {'access_token': self.access_token}
        
        async with aiohttp.ClientSession() as session:
            async with session.post(url, json=payload, params=params) as response:
                if response.status != 200:
                    error = await response.text()
                    raise Exception(f"Messenger API Error: {error}")
                
                return await response.json()
    
    # === INSTAGRAM-SPECIFIC METHODS ===
    
    async def send_instagram_story_reply(self, story_id: str, message: str):
        """Reply to Instagram story mention"""
        
        payload = {
            'recipient': {'story_id': story_id},
            'message': {'text': message}
        }
        
        return await self._send_request('/me/messages', payload)
    
    async def send_instagram_ice_breaker(self, recipient_id: str):
        """Send Instagram ice breaker questions"""
        
        ice_breakers = [
            {
                'question': '💳 Interested in credit repair?',
                'payload': 'CREDIT_REPAIR_INFO'
            },
            {
                'question': '🏡 Looking to buy/sell property?',
                'payload': 'REAL_ESTATE_INFO'
            },
            {
                'question': '📊 Need tax help?',
                'payload': 'TAX_SERVICES_INFO'
            }
        ]
        
        # Ice breakers are set at page level, not per message
        # This is a configuration example
        return ice_breakers
