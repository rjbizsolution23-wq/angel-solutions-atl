Copy# cron_follow_ups.py
import asyncio
from datetime import datetime, timedelta
import schedule
import time

class AutomatedFollowUpSystem:
    def __init__(self, db, messenger_api, voice_gen):
        self.db = db
        self.messenger = messenger_api
        self.voice = voice_gen
    
    async def run_hourly_follow_ups(self):
        """Main cron job - runs every hour"""
        
        print(f"[{datetime.now()}] Running follow-up checks...")
        
        # Get pending follow-ups
        pending = await self.db.execute("""
            SELECT * FROM follow_ups 
            WHERE status = 'pending' 
            AND scheduled_time <= ?
            ORDER BY scheduled_time ASC
        """, (datetime.now().isoformat(),))
        
        for follow_up in pending:
            await self.send_follow_up(follow_up)
        
        # Check for stale conversations (no response in 24h)
        await self.check_stale_conversations()
        
        # Re-engage cold leads (no response in 3 days)
        await self.reengage_cold_leads()
    
    async def send_follow_up(self, follow_up: Dict):
        """Send individual follow-up message"""
        
        sender_id = follow_up['sender_id']
        message = follow_up['message']
        
        try:
            # Check if user has responded since scheduling
            recent_activity = await self.check_recent_activity(sender_id)
            
            if recent_activity:
                # User already engaged, cancel follow-up
                await self.db.execute(
                    "UPDATE follow_ups SET status = 'cancelled' WHERE id = ?",
                    (follow_up['id'],)
                )
                return
            
            # Send the follow-up
            await self.messenger.send_text_message(sender_id, message)
            
            # Mark as sent
            await self.db.execute(
                "UPDATE follow_ups SET status = 'sent' WHERE id = ?",
                (follow_up['id'],)
            )
            
            print(f"✅ Sent follow-up to {sender_id}")
            
        except Exception as e:
            # Mark as failed and retry
            await self.db.execute("""
                UPDATE follow_ups 
                SET status = 'failed', retry_count = retry_count + 1
                WHERE id = ?
            """, (follow_up['id'],))
            
            print(f"❌ Follow-up failed for {sender_id}: {str(e)}")
    
    async def check_stale_conversations(self):
        """Find conversations with no reply in 24 hours"""
        
        cutoff = (datetime.now() - timedelta(hours=24)).isoformat()
        
        stale = await self.db.execute("""
            SELECT c.*, u.sender_id, u.first_name
            FROM conversations c
            JOIN users u ON c.sender_id = u.sender_id
            WHERE c.conversation_state = 'waiting'
            AND c.last_interaction < ?
        """, (cutoff,))
        
        for conv in stale:
            # Send gentle nudge
            message = f"Hey {conv['first_name']}! 👋\n\nJust checking in - did you have any other questions about {conv['current_flow']}?\n\nI'm here to help! 😊"
            
            await self.messenger.send_text_message(conv['sender_id'], message)
            
            # Schedule next follow-up in 2 days
            await self.schedule_follow_up(
                conv['sender_id'],
                "Still interested? Let me know if you'd like to move forward! 🚀",
                days=2
            )
    
    async def reengage_cold_leads(self):
        """Re-engage leads that went cold (3+ days no response)"""
        
        cutoff = (datetime.now() - timedelta(days=3)).isoformat()
        
        cold_leads = await self.db.execute("""
            SELECT u.*, l.service_interest, l.lead_source
            FROM users u
            JOIN leads l ON u.sender_id = l.sender_id
            WHERE u.updated_at < ?
            AND l.qualification_score > 50
            AND l.crm_synced = FALSE
        """, (cutoff,))
        
        for lead in cold_leads:
            # Create personalized re-engagement
            reengagement_message = await self.create_reengagement_message(lead)
            
            # Send text + voice message for impact
            await self.messenger.send_text_message(
                lead['sender_id'], 
                reengagement_message
            )
            
            # Generate and send voice message
            voice_audio = await self.voice.create_personalized_voice_response(
                lead['first_name'],
                lead['service_interest'],
                'follow_up'
            )
            
            audio_url = await self.upload_audio(voice_audio)
            await self.messenger.send_media(
                lead['sender_id'],
                'audio',
                audio_url
            )
    
    async def create_reengagement_message(self, lead: Dict) -> str:
        """Create personalized re-engagement message"""
        
        templates = {
            'credit_repair': f"Hi {lead['first_name']}! 💳\n\nI noticed you were interested in improving your credit score. We just helped someone like you increase their score by 120 points in 90 days!\n\nWant to see if we can do the same for you? I have a special offer available this week. 🎯",
            
            'real_estate': f"Hey {lead['first_name']}! 🏡\n\nStill looking for your dream home? The market just shifted - now's actually a great time to buy.\n\nI'd love to show you 3 properties that just came on the market in your area. Interested?",
            
            'tax_services': f"Hi {lead['first_name']}! 📊\n\nTax season is approaching fast. Did you know the average person overpays $1,000 in taxes?\n\nLet's make sure you get every deduction you deserve. Ready to get started?",
            
            'insurance': f"Hey {lead['first_name']}! 🛡️\n\nI ran some numbers and found you could save $400/year on insurance with better coverage.\n\nWant to see the comparison? Takes just 2 minutes."
        }
        
        return templates.get(
            lead['service_interest'], 
            f"Hi {lead['first_name']}! Still interested in {lead['service_interest']}? Let's chat! 😊"
        )
    
    async def schedule_follow_up(
        self, 
        sender_id: str, 
        message: str, 
        hours: int = 0, 
        days: int = 0
    ):
        """Schedule a future follow-up"""
        
        scheduled_time = datetime.now() + timedelta(hours=hours, days=days)
        
        await self.db.execute("""
            INSERT INTO follow_ups (sender_id, scheduled_time, message, status)
            VALUES (?, ?, ?, 'pending')
        """, (sender_id, scheduled_time.isoformat(), message))

# === DEPLOYMENT ===

def run_cron_service():
    """Run as standalone service"""
    
    system = AutomatedFollowUpSystem(db_conn, messenger_api, voice_gen)
    
    # Schedule hourly execution
    schedule.every().hour.do(lambda: asyncio.run(system.run_hourly_follow_ups()))
    
    print("🚀 Follow-up cron service started...")
    
    while True:
        schedule.run_pending()
        time.sleep(60)

if __name__ == '__main__':
    run_cron_service()
