     *   recommended_plan: '67' | 'advanced',
     *   goal: string,
     *   timeline: string,
     *   lead_score: number,
     *   conversation_summary: string
     * }
     */
    
    try {
      console.log('🔄 Syncing lead to GHL:', leadData.first_name, leadData.last_name);
      
      // Step 1: Create or update contact
      const contact = await this.createOrUpdateContact(leadData);
      
      // Step 2: Add detailed note with conversation history
      await this.addContactNote(contact.id, leadData.conversation_summary);
      
      // Step 3: Create opportunity in pipeline
      const opportunityValue = leadData.recommended_plan === 'advanced' ? 1000 : 200;
      await this.createOpportunity(contact.id, leadData, opportunityValue);
      
      // Step 4: Trigger appropriate workflow
      await this.triggerWorkflow(contact.id, leadData.recommended_plan);
      
      // Step 5: Add tags for segmentation
      await this.addTags(contact.id, leadData);
      
      console.log('✅ Lead synced successfully:', contact.id);
      
      return {
        success: true,
        ghl_contact_id: contact.id,
        opportunity_created: true
      };
      
    } catch (error) {
      console.error('❌ GHL Sync Error:', error.response?.data || error.message);
      throw error;
    }
  }
  
  async createOrUpdateContact(leadData) {
    /**
     * Create or update contact in GHL
     */
    
    const contactPayload = {
      firstName: leadData.first_name,
      lastName: leadData.last_name,
      email: leadData.email || `${leadData.sender_id}@messenger.temp`,
      phone: leadData.phone_number,
      source: `Meta ${leadData.platform === 'messenger' ? 'Messenger' : 'Instagram'} Bot`,
      locationId: this.locationId,
      customFields: [
        { key: 'sender_id', field_key: 'contact.sender_id', value: leadData.sender_id },
        { key: 'platform', field_key: 'contact.platform', value: leadData.platform },
        { key: 'recommended_plan', field_key: 'contact.recommended_plan', value: leadData.recommended_plan },
        { key: 'credit_goal', field_key: 'contact.credit_goal', value: leadData.goal || 'Not specified' },
        { key: 'timeline', field_key: 'contact.timeline', value: leadData.timeline || 'Not specified' },
        { key: 'lead_score', field_key: 'contact.lead_score', value: leadData.lead_score.toString() },
        { key: 'first_contact_date', field_key: 'contact.first_contact_date', value: new Date().toISOString() },
        { key: 'automation_source', field_key: 'contact.automation_source', value: 'Angel Solutions ATL DM Bot' }
      ],
      tags: [] // Will add separately
    };
    
    // Try to find existing contact first
    const searchResponse = await axios.get(
      `${this.baseURL}/contacts/search`,
      {
        headers: {
          'Authorization': `Bearer ${this.apiKey}`,
          'Version': '2021-07-28'
        },
        params: {
          locationId: this.locationId,
          query: leadData.phone_number || leadData.email
        }
      }
    );
    
    if (searchResponse.data.contacts && searchResponse.data.contacts.length > 0) {
      // Update existing contact
      const existingContactId = searchResponse.data.contacts[0].id;
      
      const updateResponse = await axios.put(
        `${this.baseURL}/contacts/${existingContactId}`,
        contactPayload,
        {
          headers: {
            'Authorization': `Bearer ${this.apiKey}`,
            'Content-Type': 'application/json',
            'Version': '2021-07-28'
          }
        }
      );
      
      return { id: existingContactId, ...updateResponse.data.contact };
    } else {
      // Create new contact
      const createResponse = await axios.post(
        `${this.baseURL}/contacts/`,
        contactPayload,
        {
          headers: {
            'Authorization': `Bearer ${this.apiKey}`,
            'Content-Type': 'application/json',
            'Version': '2021-07-28'
          }
        }
      );
      
      return createResponse.data.contact;
    }
  }
  
  async addContactNote(contactId, conversationSummary) {
    /**
     * Add detailed note with conversation history
     */
    
    const note = `
📱 **Automated DM Conversation Summary**

${conversationSummary}

---
🤖 Generated by Angel Solutions ATL DM Automation
📅 ${new Date().toLocaleString('en-US', { timeZone: 'America/New_York' })} EST
    `.trim();
    
    await axios.post(
      `${this.baseURL}/contacts/${contactId}/notes`,
      { body: note },
      {
        headers: {
          'Authorization': `Bearer ${this.apiKey}`,
          'Content-Type': 'application/json',
          'Version': '2021-07-28'
        }
      }
    );
  }
  
  async createOpportunity(contactId, leadData, monetaryValue) {
    /**
     * Create opportunity in Angel Solutions ATL pipeline
     */
    
    const opportunityPayload = {
      contactId: contactId,
      pipelineId: process.env.GHL_PIPELINE_ID,
      pipelineStageId: process.env.GHL_STAGE_NEW_LEAD,
      name: `${leadData.recommended_plan === 'advanced' ? 'Advanced Repair' : '$67 Credit Repair'} - ${leadData.first_name} ${leadData.last_name}`,
      monetaryValue: monetaryValue,
      source: `Meta ${leadData.platform}`,
      status: 'open',
      customFields: [
        { key: 'credit_goal', value: leadData.goal },
        { key: 'timeline', value: leadData.timeline },
        { key: 'plan_type', value: leadData.recommended_plan }
      ]
    };
    
    await axios.post(
      `${this.baseURL}/opportunities/`,
      opportunityPayload,
      {
        headers: {
          'Authorization': `Bearer ${this.apiKey}`,
          'Content-Type': 'application/json',
          'Version': '2021-07-28'
        }
      }
    );
  }
  
  async triggerWorkflow(contactId, recommendedPlan) {
    /**
     * Trigger appropriate GHL workflow
     */
    
    const workflowMap = {
      '67': process.env.GHL_WORKFLOW_67_PLAN,      // Workflow ID for $67 plan nurture
      'advanced': process.env.GHL_WORKFLOW_ADVANCED // Workflow ID for Advanced plan follow-up
    };
    
    const workflowId = workflowMap[recommendedPlan];
    
    if (workflowId) {
      await axios.post(
        `${this.baseURL}/contacts/${contactId}/workflow/${workflowId}`,
        {},
        {
          headers: {
            'Authorization': `Bearer ${this.apiKey}`,
            'Content-Type': 'application/json',
            'Version': '2021-07-28'
          }
        }
      );
    }
  }
  
  async addTags(contactId, leadData) {
    /**
     * Add segmentation tags
     */
    
    const tags = [
      'DM_Bot_Lead',
      leadData.platform === 'messenger' ? 'Meta_Messenger' : 'Instagram_DM',
      leadData.recommended_plan === '67' ? '67_Plan_Qualified' : 'Advanced_Qualified',
      `Goal_${leadData.goal?.replace(/ /g, '_')}`,
      `Timeline_${leadData.timeline?.replace(/ /g, '_')}`,
      `LeadScore_${leadData.lead_score >= 70 ? 'Hot' : leadData.lead_score >= 40 ? 'Warm' : 'Cold'}`
    ];
    
    await axios.post(
      `${this.baseURL}/contacts/${contactId}/tags`,
      { tags: tags },
      {
        headers: {
          'Authorization': `Bearer ${this.apiKey}`,
          'Content-Type': 'application/json',
          'Version': '2021-07-28'
        }
      }
    );
  }
  
  async updatePipelineStage(contactId, stage) {
    /**
     * Move contact through pipeline stages
     * stage: 'new' | 'discovery_booked' | 'discovery_complete' | 'active_client' | 'lost'
     */
    
    const stageMap = {
      'new': process.env.GHL_STAGE_NEW_LEAD,
      'discovery_booked': process.env.GHL_STAGE_DISCOVERY_BOOKED,
      'discovery_complete': process.env.GHL_STAGE_DISCOVERY_COMPLETE,
      'active_client': process.env.GHL_STAGE_ACTIVE_CLIENT,
      'lost': process.env.GHL_STAGE_LOST
    };
    
    const stageId = stageMap[stage];
    
    if (!stageId) {
      console.error('Invalid stage:', stage);
      return;
    }
    
    // Find the opportunity for this contact
    const opportunities = await axios.get(
      `${this.baseURL}/opportunities/search`,
      {
        headers: {
          'Authorization': `Bearer ${this.apiKey}`,
          'Version': '2021-07-28'
        },
        params: {
          contactId: contactId,
          pipelineId: process.env.GHL_PIPELINE_ID
        }
      }
    );
    
    if (opportunities.data.opportunities && opportunities.data.opportunities.length > 0) {
      const opportunityId = opportunities.data.opportunities[0].id;
      
      await axios.put(
        `${this.baseURL}/opportunities/${opportunityId}`,
        { pipelineStageId: stageId },
        {
          headers: {
            'Authorization': `Bearer ${this.apiKey}`,
            'Content-Type': 'application/json',
            'Version': '2021-07-28'
          }
        }
      );
      
      console.log(`✅ Moved contact ${contactId} to stage: ${this.pipelineStages[stage]}`);
    }
  }
  
  async bookingConfirmed(contactId, bookingDetails) {
    /**
     * Update when discovery call is booked
     */
    
    await this.updatePipelineStage(contactId, 'discovery_booked');
    
    await this.addContactNote(contactId, `
🗓️ **Discovery Call Booked**

Date: ${bookingDetails.date}
Time: ${bookingDetails.time}
Booking Source: DM Bot Automation

Reminder: Send confirmation + prep materials 24h before call
    `.trim());
  }
  
  async callCompleted(contactId, outcome) {
    /**
     * Update after discovery call
     */
    
    if (outcome === 'converted') {
      await this.updatePipelineStage(contactId, 'active_client');
      await this.addTags(contactId, { tags: ['Client_Active'] });
    } else if (outcome === 'follow_up') {
      await this.updatePipelineStage(contactId, 'discovery_complete');
      await this.addTags(contactId, { tags: ['Needs_Follow_Up'] });
    } else {
      await this.updatePipelineStage(contactId, 'lost');
      await this.addTags(contactId, { tags: ['Lost_Not_Interested'] });
    }
  }
}

