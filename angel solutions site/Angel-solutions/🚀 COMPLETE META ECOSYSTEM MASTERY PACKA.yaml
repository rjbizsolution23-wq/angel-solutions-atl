Copy// stripe_checkout_engine.js
const stripe = require('stripe')(process.env.STRIPE_SECRET_KEY);
const axios = require('axios');

class StripeCheckoutEngine {
  constructor(dbConnection, messengerAPI) {
    this.db = dbConnection;
    this.messenger = messengerAPI;
    this.products = {
      credit_repair: {
        price_id: 'price_credit_repair_monthly',
        name: 'Credit Repair Service',
        amount: 9900 // $99
      },
      real_estate: {
        price_id: 'price_real_estate_consultation',
        name: 'Real Estate Consultation',
        amount: 29900 // $299
      },
      tax_filing: {
        price_id: 'price_tax_filing_standard',
        name: 'Tax Filing Service',
        amount: 14900 // $149
      },
      insurance_quote: {
        price_id: 'price_insurance_quote',
        name: 'Insurance Quote',
        amount: 0 // Free, but captures info
      }
    };
  }
  
  async createCheckoutSession(senderId, serviceType, metadata = {}) {
    const product = this.products[serviceType];
    
    if (!product) {
      throw new Error(`Unknown service type: ${serviceType}`);
    }
    
    // Get user details from D1
    const user = await this.db.prepare(
      'SELECT * FROM users WHERE sender_id = ?'
    ).bind(senderId).first();
    
    // Create Stripe Checkout Session
    const session = await stripe.checkout.sessions.create({
      payment_method_types: ['card'],
      line_items: [{
        price: product.price_id,
        quantity: 1,
      }],
      mode: 'payment',
      success_url: `${process.env.BASE_URL}/success?session_id={CHECKOUT_SESSION_ID}`,
      cancel_url: `${process.env.BASE_URL}/cancel`,
      customer_email: user?.email,
      client_reference_id: senderId,
      metadata: {
        sender_id: senderId,
        service_type: serviceType,
        platform: 'messenger',
        ...metadata
      }
    });
    
    // Save to D1
    await this.db.prepare(`
      INSERT INTO checkout_sessions (sender_id, stripe_session_id, product_id, amount, status)
      VALUES (?, ?, ?, ?, 'created')
    `).bind(senderId, session.id, serviceType, product.amount).run();
    
    // Send checkout link via Messenger
    await this.sendCheckoutMessage(senderId, session.url, product.name);
    
    return session;
  }
  
  async sendCheckoutMessage(senderId, checkoutUrl, productName) {
    const message = {
      recipient: { id: senderId },
      message: {
        attachment: {
          type: 'template',
          payload: {
            template_type: 'button',
            text: `Ready to get started with ${productName}? 🚀\n\nClick below to complete your secure checkout:`,
            buttons: [
              {
                type: 'web_url',
                url: checkoutUrl,
                title: '💳 Complete Purchase',
                webview_height_ratio: 'tall'
              }
            ]
          }
        }
      }
    };
    
    await this.messenger.sendMessage(message);
  }
  
  async handleWebhook(event) {
    switch (event.type) {
      case 'checkout.session.completed':
        await this.handleCheckoutSuccess(event.data.object);
        break;
      case 'checkout.session.expired':
        await this.handleCheckoutExpired(event.data.object);
        break;
    }
  }
  
  async handleCheckoutSuccess(session) {
    const senderId = session.client_reference_id;
    const serviceType = session.metadata.service_type;
    
    // Update D1
    await this.db.prepare(`
      UPDATE checkout_sessions 
      SET status = 'completed' 
      WHERE stripe_session_id = ?
    `).bind(session.id).run();
    
    // Update lead status
    await this.db.prepare(`
      UPDATE leads 
      SET qualification_score = 100, crm_synced = TRUE
      WHERE sender_id = ?
    `).bind(senderId).run();
    
    // Send confirmation message
    await this.messenger.sendMessage({
      recipient: { id: senderId },
      message: {
        text: `🎉 Thank you for your purchase!\n\nYour ${serviceType.replace('_', ' ')} service is now active. Our team will reach out within 24 hours to get started.\n\nYou'll receive an email confirmation shortly.`
      }
    });
    
    // Trigger GoHighLevel CRM sync
    await this.syncToGHL(senderId, serviceType, 'customer');
  }
  
  async syncToGHL(senderId, serviceType, status) {
    const user = await this.db.prepare(
      'SELECT * FROM users WHERE sender_id = ?'
    ).bind(senderId).first();
    
    const ghlPayload = {
      email: user.email,
      phone: user.phone_number,
      firstName: user.first_name,
      lastName: user.last_name,
      tags: [serviceType, status, 'messenger_lead'],
      customFields: {
        lead_source: 'Meta Messenger',
        service_interest: serviceType,
        purchase_date: new Date().toISOString()
      }
    };
    
    await axios.post(
      `${process.env.GHL_API_URL}/contacts`,
      ghlPayload,
      {
        headers: {
          'Authorization': `Bearer ${process.env.GHL_API_KEY}`,
          'Content-Type': 'application/json'
        }
      }
    );
  }
}

