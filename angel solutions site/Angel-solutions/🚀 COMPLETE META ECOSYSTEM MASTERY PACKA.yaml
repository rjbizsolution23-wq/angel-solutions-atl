from anthropic import Anthropic
from openai import OpenAI
import google.generativeai as genai
from typing import List, Dict

class MasterEmpireAIEnsemble:
    """
    Multi-model AI ensemble for intelligent response generation
    Uses Claude, GPT-4, and Gemini for consensus-based responses
    """
    
    def __init__(self):
        self.claude = Anthropic(api_key=os.getenv('ANTHROPIC_API_KEY'))
        self.openai = OpenAI(api_key=os.getenv('OPENAI_API_KEY'))
        genai.configure(api_key=os.getenv('GOOGLE_API_KEY'))
        self.gemini = genai.GenerativeModel('gemini-pro')
        
        self.system_prompt = """You are an expert business consultant specializing in:
        - Credit Repair Services
        - Real Estate Transactions
        - Tax Preparation & Planning
        - Insurance Solutions
        
        Your role is to:
        1. Qualify leads through conversational questions
        2. Address objections professionally
        3. Guide prospects toward scheduling/purchasing
        4. Provide accurate, compliant information
        
        Always be professional, empathetic, and solution-focused."""
    
    async def generate_response(
        self, 
        message: str, 
        context: Dict,
        service_type: str
    ) -> Dict:
        """
        Generate consensus response from multiple AI models
        """
        
        # Get responses from all three models
        responses = await asyncio.gather(
            self.get_claude_response(message, context, service_type),
            self.get_gpt4_response(message, context, service_type),
            self.get_gemini_response(message, context, service_type)
        )
        
        # Analyze consensus
        final_response = await self.synthesize_responses(responses)
        
        # Add personality based on service type
        personalized = await self.apply_service_personality(
            final_response, 
            service_type
        )
        
        return {
            'text': personalized['text'],
            'suggested_actions': personalized['actions'],
            'confidence': personalized['confidence'],
            'requires_human': personalized['escalate']
        }
    
    async def get_claude_response(self, message: str, context: Dict, service: str) -> str:
        prompt = f"""{self.system_prompt}

Service Type: {service}

User Message: "{message}"

Context:
{json.dumps(context, indent=2)}

Generate a professional, conversational response that:
1. Addresses the user's specific question/concern
2. Builds trust and credibility
3. Moves them closer to booking/purchasing
4. Includes a clear call-to-action

Response:"""
        
        response = await self.claude.messages.create(
            model="claude-3-5-sonnet-20241022",
            max_tokens=500,
            messages=[{"role": "user", "content": prompt}]
        )
        
        return response.content[0].text
    
    async def get_gpt4_response(self, message: str, context: Dict, service: str) -> str:
        response = await self.openai.chat.completions.create(
            model="gpt-4-turbo-preview",
            messages=[
                {"role": "system", "content": self.system_prompt},
                {"role": "user", "content": f"Service: {service}\nMessage: {message}\nContext: {context}"}
            ],
            max_tokens=500
        )
        
        return response.choices[0].message.content
    
    async def get_gemini_response(self, message: str, context: Dict, service: str) -> str:
        prompt = f"{self.system_prompt}\n\nService: {service}\nMessage: {message}"
        response = await self.gemini.generate_content(prompt)
        return response.text
    
    async def synthesize_responses(self, responses: List[str]) -> Dict:
        """
        Use Claude to synthesize the best elements from all responses
        """
        
        synthesis_prompt = f"""Analyze these three AI-generated responses and create the BEST possible response by:
        1. Taking the most accurate information
        2. Using the most persuasive language
        3. Including the strongest call-to-action
        4. Maintaining a professional, friendly tone

Response 1 (Claude):
{responses[0]}

Response 2 (GPT-4):
{responses[1]}

Response 3 (Gemini):
{responses[2]}

Create the optimal synthesized response:"""
        
        final = await self.claude.messages.create(
            model="claude-3-5-sonnet-20241022",
            max_tokens=600,
            messages=[{"role": "user", "content": synthesis_prompt}]
        )
        
        return {
            'text': final.content[0].text,
            'confidence': 0.95,
            'escalate': False
        }
    
    async def apply_service_personality(self, response: Dict, service: str) -> Dict:
        """Apply service-specific personality and CTAs"""
        
        personalities = {
            'credit_repair': {
                'tone': 'empathetic and empowering',
                'cta': '📊 Ready to see your free credit analysis?',
                'emoji': '💪'
            },
            'real_estate': {
                'tone': 'professional and consultative',
                'cta': '🏡 Want to schedule a property viewing?',
                'emoji': '🏠'
            },
            'tax_services': {
                'tone': 'trustworthy and detail-oriented',
                'cta': '📋 Ready to maximize your tax refund?',
                'emoji': '💰'
            },
            'insurance': {
                'tone': 'protective and informative',
                'cta': '🛡️ Get your free quote in 2 minutes?',
                'emoji': '✅'
            }
        }
        
        personality = personalities.get(service, personalities['credit_repair'])
        
        # Add emoji and CTA
        enhanced_text = f"{personality['emoji']} {response['text']}\n\n{personality['cta']}"
        
        response['text'] = enhanced_text
        response['actions'] = ['schedule_call', 'get_quote', 'view_pricing']
        
        return response
