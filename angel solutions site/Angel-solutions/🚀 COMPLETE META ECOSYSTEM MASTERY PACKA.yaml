            message += "• $20k+ funding education\n"
            message += "• 3-6 month timeline\n\n"
            message += "Ready to get started? I'll send you the link to join! 🚀"
            
            return message
        
        # If qualified for Advanced
        if plan == 'advanced':
            message = f"Based on your situation, I think the **Advanced Repair plan** is your best bet:\n\n"
            message += "\n".join([f"✅ {reason}" for reason in reasons[:3]])
            message += f"\n\n🏆 **Advanced Repair ($795-$1,250):**\n"
