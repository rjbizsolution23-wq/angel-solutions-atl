Messenger Webhook Handler (Node.js)
Copyconst express = require('express');
const app = express();
app.use(express.json());

const PAGE_ACCESS_TOKEN = process.env.PAGE_ACCESS_TOKEN;
const VERIFY_TOKEN = process.env.VERIFY_TOKEN;

// Webhook verification
app.get('/webhook', (req, res) => {
  if (req.query['hub.verify_token'] === VERIFY_TOKEN) {
    res.send(req.query['hub.challenge']);
  } else {
    res.sendStatus(403);
  }
});

// Receive messages
app.post('/webhook', (req, res) => {
  const { object, entry } = req.body;
  
  if (object === 'page') {
    entry.forEach(event => {
      const messaging = event.messaging[0];
      if (messaging.message) {
        handleMessage(messaging.sender.id, messaging.message);
      }
    });
  }
  res.sendStatus(200);
});

// Send message
function sendMessage(senderId, message) {
  fetch(`https://graph.facebook.com/v18.0/me/messages?access_token=${PAGE_ACCESS_TOKEN}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      recipient: { id: senderId },
      message: message
    })
  });
}
