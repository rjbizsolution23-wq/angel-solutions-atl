Copy// cloudflare-worker.js - Angel Solutions ATL Webhook Handler

addEventListener('fetch', event => {
  event.respondWith(handleRequest(event.request))
})

const VERIFY_TOKEN = 'ANGEL_SOLUTIONS_VERIFY_TOKEN_2026';
const PAGE_ACCESS_TOKEN = 'YOUR_META_PAGE_ACCESS_TOKEN';
const RICK_PHONE = '+14703386689'; // SMS escalation

async function handleRequest(request) {
  const url = new URL(request.url);
  
  // === WEBHOOK VERIFICATION (GET) ===
  if (request.method === 'GET') {
    const mode = url.searchParams.get('hub.mode');
    const token = url.searchParams.get('hub.verify_token');
    const challenge = url.searchParams.get('hub.challenge');
    
    if (mode === 'subscribe' && token === VERIFY_TOKEN) {
      console.log('✅ Webhook verified for Angel Solutions ATL');
      return new Response(challenge, { status: 200 });
    }
    return new Response('Forbidden', { status: 403 });
  }
  
  // === WEBHOOK EVENTS (POST) ===
  if (request.method === 'POST') {
    const body = await request.json();
    
    console.log('📨 Received webhook:', JSON.stringify(body, null, 2));
    
    // Route based on platform
    if (body.object === 'page') {
      await handleMessengerEvent(body);
    } else if (body.object === 'instagram') {
      await handleInstagramEvent(body);
    }
    
    return new Response('EVENT_RECEIVED', { status: 200 });
  }
  
  return new Response('Method not allowed', { status: 405 });
}

async function handleMessengerEvent(body) {
  for (const entry of body.entry) {
    // Handle messages
    if (entry.messaging) {
      for (const event of entry.messaging) {
        if (event.message && event.message.text) {
          await processIncomingMessage(
            event.sender.id,
            event.message.text,
            'messenger'
          );
        }
      }
    }
    
    // Handle comments
    if (entry.changes) {
      for (const change of entry.changes) {
        if (change.field === 'feed' && change.value.item === 'comment') {
          await processComment(change.value);
        }
      }
    }
  }
}

async function handleInstagramEvent(body) {
  for (const entry of body.entry) {
    if (entry.messaging) {
      for (const event of entry.messaging) {
        if (event.message && event.message.text) {
          await processIncomingMessage(
            event.sender.id,
            event.message.text,
            'instagram'
          );
        }
      }
    }
  }
}

async function processIncomingMessage(senderId, messageText, platform) {
  console.log(`💬 Processing ${platform} message from ${senderId}: "${messageText}"`);
  
  // Log to D1 immediately (compliance audit trail)
  await logInteraction(senderId, messageText, platform);
  
  // Check if this triggers a keyword
  const keywordMatch = await checkKeywords(messageText);
  
  if (keywordMatch) {
    // Keyword-triggered response
    await handleKeywordTrigger(senderId, keywordMatch, messageText, platform);
  } else {
    // AI-powered response
    await handleAIResponse(senderId, messageText, platform);
  }
}

async function checkKeywords(text) {
  const textLower = text.toLowerCase();
  
  // Query D1 for keyword matches
  const result = await ANGEL_DB.prepare(`
    SELECT * FROM keywords 
    WHERE ? LIKE '%'||keyword||'%' 
    ORDER BY priority DESC, compliance_flag DESC 
    LIMIT 1
  `).bind(textLower).first();
  
  return result;
}

async function handleKeywordTrigger(senderId, keyword, originalMessage, platform) {
  console.log(`🎯 Keyword triggered: ${keyword.keyword} (${keyword.intent})`);
  
  let response;
  
  switch (keyword.action) {
    case 'send_pricing_info':
      response = await getPricingResponse(senderId);
      break;
      
    case 'send_67_details':
      response = await get67PlanDetails();
      break;
      
    case 'send_advanced_details':
      response = await getAdvancedPlanDetails();
      break;
      
    case 'explain_timeline':
      response = await getTimelineResponse();
      break;
      
    case 'compliance_response':
      response = await getComplianceResponse(keyword.keyword);
      await flagForCompliance(senderId, originalMessage);
      break;
      
    case 'qualify_then_book':
      response = await qualifyForBooking(senderId);
      break;
      
    case 'value_rebuttal':
      response = await getValueRebuttal(senderId);
      break;
      
    case 'closing_script':
      response = await getClosingScript();
      break;
      
    default:
      response = await handleAIResponse(senderId, originalMessage, platform);
      return;
  }
  
  // Send response via Meta API
  await sendMessage(senderId, response, platform);
  
  // Log response
  await logResponse(senderId, originalMessage, response, keyword.action);
}

