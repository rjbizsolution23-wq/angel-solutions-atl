const axios = require('axios');

class GoHighLevelCRMSync {
  constructor(apiKey, locationId) {
    this.apiKey = apiKey;
    this.locationId = locationId;
    this.baseURL = 'https://services.leadconnectorhq.com';
  }
  
  async syncLead(leadData) {
    /**
     * Complete lead sync with custom fields
     */
    
    const contact = {
      firstName: leadData.first_name,
      lastName: leadData.last_name,
      email: leadData.email,
      phone: leadData.phone_number,
      source: 'Meta Messenger Bot',
      tags: [
        leadData.service_interest,
        `lead_score_${leadData.lead_score}`,
        leadData.platform // 'messenger', 'instagram', 'whatsapp'
      ],
      customFields: [
        { key: 'sender_id', value: leadData.sender_id },
        { key: 'lead_source_detail', value: 'Automated DM Campaign' },
        { key: 'qualification_score', value: leadData.lead_score },
        { key: 'first_message', value: leadData.first_message },
        { key: 'last_interaction', value: new Date().toISOString() },
        { key: 'conversation_count', value: leadData.interaction_count },
        { key: 'purchase_intent', value: leadData.purchase_intent ? 'Yes' : 'No' }
      ]
    };
    
    try {
      const response = await axios.post(
        `${this.baseURL}/contacts/`,
        contact,
        {
          headers: {
            'Authorization': `Bearer ${this.apiKey}`,
            'Content-Type': 'application/json',
            'Version': '2021-07-28'
          }
        }
      );
      
      const contactId = response.data.contact.id;
      
      // Add note with conversation history
      await this.addContactNote(contactId, leadData.conversation_summary);
      
      // Trigger appropriate workflow
      await this.triggerWorkflow(contactId, leadData.service_interest);
      
      return response.data;
    } catch (error) {
      console.error('GHL Sync Error:', error.response?.data || error.message);
      throw error;
    }
  }
  
  async addContactNote(contactId, note) {
    await axios.post(
      `${this.baseURL}/contacts/${contactId}/notes`,
      { body: note },
      {
        headers: {
          'Authorization': `Bearer ${this.apiKey}`,
          'Content-Type': 'application/json'
        }
      }
    );
  }
  
  async triggerWorkflow(contactId, serviceType) {
    /**
     * Trigger service-specific workflows
     */
    
    const workflowMap = {
      'credit_repair': 'workflow_credit_onboarding',
      'real_estate': 'workflow_property_consultation',
      'tax_services': 'workflow_tax_intake',
      'insurance': 'workflow_quote_generation'
    };
    
    const workflowId = workflowMap[serviceType];
    
    if (workflowId) {
      await axios.post(
        `${this.baseURL}/workflows/${workflowId}/trigger`,
        { contactId },
        {
          headers: {
            'Authorization': `Bearer ${this.apiKey}`,
            'Content-Type': 'application/json'
          }
        }
      );
    }
  }
  
  async createOpportunity(leadData, value) {
    /**
     * Create sales opportunity/pipeline entry
     */
    
    const opportunity = {
      contactId: leadData.ghl_contact_id,
      pipelineId: process.env.GHL_PIPELINE_ID,
      pipelineStageId: process.env.GHL_STAGE_NEW_LEAD,
      name: `${leadData.service_interest} - ${leadData.first_name} ${leadData.last_name}`,
      monetaryValue: value,
      source: 'Meta Messenger Automation',
      status: 'open'
    };
    
    await axios.post(
      `${this.baseURL}/opportunities/`,
      opportunity,
      {
        headers: {
          'Authorization': `Bearer ${this.apiKey}`,
          'Content-Type': 'application/json'
        }
      }
    );
  }
}

