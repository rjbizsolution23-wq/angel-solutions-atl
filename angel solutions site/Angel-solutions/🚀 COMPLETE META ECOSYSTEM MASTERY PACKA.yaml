    async def _update_credit_profile(self, sender_id: str, updates: Dict):
        """Update credit profile in D1"""
        
        # Check if profile exists
        existing = await self.db.prepare(
            'SELECT id FROM credit_profiles WHERE sender_id = ?'
        ).bind(sender_id).first()
        
        if existing:
            # Update
            set_clause = ', '.join([f"{k} = ?" for k in updates.keys()])
            values = list(updates.values()) + [sender_id]
            
            await self.db.prepare(
                f'UPDATE credit_profiles SET {set_clause} WHERE sender_id = ?'
            ).bind(*values).run()
        else:
            # Insert
            updates['sender_id'] = sender_id
            columns = ', '.join(updates.keys())
            placeholders = ', '.join(['?' for _ in updates])
            
            await self.db.prepare(
                f'INSERT INTO credit_profiles ({columns}) VALUES ({placeholders})'
            ).bind(*updates.values()).run()
    
    async def get_qualification_message(self, qualification: Dict) -> str:
        """
        Generate message based on qualification result
        """
        
        plan = qualification['recommended_plan']
        reasons = qualification['reasons']
        next_questions = qualification['next_questions']
        
        # If more info needed
        if next_questions:
            return f"Got it! To recommend the best plan, I just need a bit more info:\n\n" + "\n".join([f"• {q}" for q in next_questions])
        
        # If qualified for $67
        if plan == '67':
            message = f"Perfect! Based on what you've shared, I think the **$67/month plan** is ideal for you:\n\n"
            message += "\n".join([f"✅ {reason}" for reason in reasons[:3]])
            message += f"\n\n💳 **$67/month includes:**\n"
            message += "• Up to 5 disputes/month\n"
